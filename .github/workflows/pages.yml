# Publie le site : génère les PDF des slides et le HTML des labos, puis déploie GitHub Pages.
#
# Ne tourne que sur le dépôt public : les deux dépôts partagent leur historique, donc ce fichier
# est aussi dans website-private, où Pages n'est pas servi.
#
# Sur macOS, et pas Linux : les decks sont en Helvetica et Courier, absents de Linux. Les polices
# de remplacement changent les retours à la ligne dans des blocs positionnés en absolu, et le PDF
# ne ressemblerait plus à ce qu'on voit en local.
#
# Le générateur de PDF vit dans le dépôt privé sdr-classroom/slides-editor, lu par une clé de
# déploiement en lecture seule (secret SLIDES_EDITOR_DEPLOY_KEY). Il est supprimé avant l'envoi
# du site, pour ne pas être publié.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PANDOC_VERSION: 3.12.1

jobs:
  build:
    if: github.repository == 'sdr-classroom/sdr-classroom.github.io'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sdr-classroom/slides-editor
          path: slides-editor
          ssh-key: ${{ secrets.SLIDES_EDITOR_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: slides-editor/package-lock.json

      - name: Installer le générateur de PDF
        working-directory: slides-editor
        run: |
          npm ci
          npx playwright install chromium

      - name: Générer les PDF des slides
        working-directory: slides-editor
        run: npm run pdf -- --all

      - name: Installer pandoc
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pandoc.zip" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
          unzip -q "$RUNNER_TEMP/pandoc.zip" -d "$RUNNER_TEMP/pandoc"
          dirname "$(find "$RUNNER_TEMP/pandoc" -name pandoc -type f)" >> "$GITHUB_PATH"

      - name: Générer le HTML des labos
        run: ./mdToHtml.sh

      - name: Retirer le générateur, qui est privé
        run: rm -rf slides-editor

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
